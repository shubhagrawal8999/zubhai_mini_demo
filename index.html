<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zubhai</title>
  <style>
    :root { --bg:#111; --gold:#FFD700; --text:#f4f4f4; --muted:#9f9f9f; }
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Segoe UI,sans-serif}
    .nav{display:flex;justify-content:space-between;align-items:center;padding:14px 22px;border-bottom:1px solid var(--gold)}
    .avatar{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#ffe889,var(--gold));box-shadow:0 4px 15px rgba(255,215,0,.35)}
    .points{font-weight:700;color:var(--gold)}
    .wrap{max-width:900px;margin:24px auto;padding:0 16px}
    .card{border:1px solid var(--gold);border-radius:12px;padding:18px;background:#151515;transition:.25s}
    .card:hover{transform:translateY(-2px)}
    input,textarea,button{width:100%;background:#191919;color:var(--text);border:1px solid var(--gold);border-radius:8px;padding:10px;margin-top:10px}
    button{background:var(--gold);color:#111;font-weight:700;cursor:pointer;transition:.2s} button:hover{filter:brightness(1.08)}
    .hidden{display:none}
    .row{display:flex;gap:12px}
    .muted{color:var(--muted)}
    table{width:100%;border-collapse:collapse;margin-top:10px} td,th{padding:10px;border-bottom:1px solid #333;text-align:left} th{color:var(--gold)}
  </style>
</head>
<body>
  <div class="nav">
    <div class="row" style="align-items:center"><div class="avatar"></div><strong>Zubhai</strong></div>
    <div>
      Day <span id="day">1</span> · <span class="points"><span id="points">0</span> pts</span>
    </div>
  </div>

  <div class="wrap">
    <section id="screen-onboard" class="card">
      <h2>Onboarding Agent</h2>
      <p class="muted">Answer 5 questions to personalize your 21-day loop.</p>
      <input id="uid" placeholder="User ID (or auth UUID)" />
      <input id="q1" placeholder="Field"/><input id="q2" placeholder="Level"/><input id="q3" placeholder="Goal"/><input id="q4" placeholder="Language"/><input id="q5" placeholder="Daily time commitment"/>
      <button onclick="completeOnboarding()">Save & Start</button>
    </section>

    <section id="screen-challenge" class="card hidden" style="margin-top:14px">
      <h2>Taskmaster Agent</h2>
      <p id="challenge">Loading challenge...</p>
      <textarea id="submission" rows="5" placeholder="Paste your output or URL"></textarea>
      <button onclick="submitWork()">Submit to Grader</button>
      <button onclick="loadLeaderboard()">View Leaderboard</button>
    </section>

    <section id="screen-score" class="card hidden" style="margin-top:14px">
      <h2>Grader Agent Result</h2>
      <p>Score: <span id="score" class="points">0</span>/10</p>
      <p id="feedback" class="muted"></p>
    </section>

    <section id="screen-leaderboard" class="card hidden" style="margin-top:14px">
      <h2>Top 10 Leaderboard</h2>
      <table><thead><tr><th>#</th><th>User</th><th>Field</th><th>Points</th><th>Day</th></tr></thead><tbody id="leaderRows"></tbody></table>
    </section>
  </div>

<script>
const API_BASE = "https://zubhai-zubhai-backened.hf.space";
let state = { user_id: localStorage.getItem('user_id') || '', current_day: 1, total_points: 0, onboarding_complete: false };

function setState(next){ state = { ...state, ...next }; localStorage.setItem('user_id', state.user_id); document.getElementById('day').textContent=state.current_day; document.getElementById('points').textContent=state.total_points; }
function show(id){['screen-onboard','screen-challenge','screen-score','screen-leaderboard'].forEach(x=>document.getElementById(x).classList.add('hidden')); document.getElementById(id).classList.remove('hidden');}

async function api(path, options={}){
  const res = await fetch(API_BASE+path, {headers:{'Content-Type':'application/json'}, ...options});
  const text = await res.text();
  let data = {}; try { data = text ? JSON.parse(text) : {}; } catch { data = {}; }
  if(!res.ok) throw new Error(data.detail || 'Request failed');
  return data;
}

async function bootstrap(){
  if(!state.user_id){ show('screen-onboard'); return; }
  try {
    const s = await api(`/state/${state.user_id}`);
    setState(s);
    if(!s.onboarding_complete){ show('screen-onboard'); return; }
    show('screen-challenge'); await getChallenge();
  } catch { show('screen-onboard'); }
}

async function completeOnboarding(){
  const user_id = document.getElementById('uid').value.trim();
  const answers = ['q1','q2','q3','q4','q5'].map(id=>document.getElementById(id).value.trim());
  if(!user_id || answers.some(v=>!v)) return alert('Please fill all 6 fields.');
  await api('/onboard',{method:'POST',body:JSON.stringify({user_id,answers})});
  setState({user_id,onboarding_complete:true,current_day:1,total_points:0});
  show('screen-challenge');
  await getChallenge();
}

async function getChallenge(){
  const data = await api('/generate-challenge',{method:'POST',body:JSON.stringify({user_id:state.user_id})});
  document.getElementById('challenge').textContent = data.challenge;
}

async function submitWork(){
  const submission = document.getElementById('submission').value.trim();
  if(!submission) return;
  const data = await api('/grade',{method:'POST',body:JSON.stringify({user_id:state.user_id,submission})});
  setState({current_day:data.current_day,total_points:data.total_points});
  document.getElementById('score').textContent = data.score;
  document.getElementById('feedback').textContent = data.feedback;
  show('screen-score');
}

async function loadLeaderboard(){
  const data = await api('/leaderboard');
  const rows = data.top || [];
  document.getElementById('leaderRows').innerHTML = rows.map((r,i)=>`<tr><td>${i+1}</td><td>${r.id}</td><td>${r.field||'-'}</td><td>${r.total_points||0}</td><td>${r.current_day||1}</td></tr>`).join('');
  show('screen-leaderboard');
}
bootstrap();
</script>
</body>
</html>
