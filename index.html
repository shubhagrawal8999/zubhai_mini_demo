<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zubhai</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    :root{--bg:#07090f;--surface:rgba(20,24,36,.78);--card:rgba(17,20,31,.88);--gold:#F4C542;--cyan:#4BD9FF;--text:#EAF0FF;--muted:#99A3C5;--border:rgba(255,255,255,.12)}
    *{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
    #bg-canvas{position:fixed;inset:0;z-index:0}.glow{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(800px 400px at 10% 10%,rgba(75,217,255,.15),transparent),radial-gradient(900px 500px at 90% 90%,rgba(244,197,66,.14),transparent)}
    .wrap{position:relative;z-index:2}
    nav{display:flex;justify-content:space-between;align-items:center;padding:18px 28px;background:rgba(8,10,16,.55);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
    .logo{font-weight:800;letter-spacing:1px;color:var(--gold)}
    .badge{padding:8px 12px;border:1px solid var(--border);border-radius:999px;background:rgba(255,255,255,.04);font-size:13px;color:var(--muted)}
    .screen{display:none;max-width:900px;margin:40px auto;padding:0 20px}.screen.active{display:block}
    .panel{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:28px;backdrop-filter:blur(8px);box-shadow:0 20px 60px rgba(0,0,0,.35)}
    h1,h2{margin:0 0 10px} .sub{color:var(--muted);margin-bottom:18px}
    #chat-box{height:320px;overflow:auto;padding:16px;border-radius:14px;background:var(--card);border:1px solid var(--border)}
    .msg{margin:12px 0;display:flex}.msg.user{justify-content:flex-end}.bubble{max-width:78%;padding:12px 14px;border-radius:14px;line-height:1.45}
    .msg.ai .bubble{background:rgba(75,217,255,.1);border:1px solid rgba(75,217,255,.35);color:#c8f4ff}.msg.user .bubble{background:rgba(244,197,66,.13);border:1px solid rgba(244,197,66,.35);color:#ffe7ad}
    .row{display:flex;gap:10px;margin-top:12px}.input{flex:1;padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text)}
    .btn{padding:12px 16px;border-radius:12px;border:none;cursor:pointer;font-weight:700}.btn-cyan{background:var(--cyan);color:#032430}
    .skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:10px}
    .skill{padding:16px;border-radius:14px;background:var(--card);border:1px solid var(--border);cursor:pointer;color:var(--text);text-align:left;transition:.2s}
    .skill:hover{transform:translateY(-2px);border-color:rgba(244,197,66,.6);box-shadow:0 10px 25px rgba(244,197,66,.15)}
    .lobby-card{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px}
    .stat b{color:var(--gold)}
    @media(max-width:640px){.lobby-card{grid-template-columns:1fr}}
  </style>
</head>
<body>
<canvas id="bg-canvas"></canvas><div class="glow"></div>
<div class="wrap">
<nav><div class="logo">⚡ ZUBHAI</div><div class="badge">21-day AI skill program</div></nav>

<section class="screen active" id="screen-onboard">
  <div class="panel">
    <h2>Build your profile</h2>
    <div class="sub">Answer a few quick prompts and we’ll set your path.</div>
    <div id="chat-box"></div>
    <div class="row">
      <input id="chat-input" class="input" placeholder="Type your answer..." onkeypress="if(event.key==='Enter') sendMessage()" />
      <button class="btn btn-cyan" onclick="sendMessage()">Send</button>
    </div>
  </div>
</section>

<section class="screen" id="screen-skill">
  <div class="panel">
    <h2>Choose your 21-day skill program</h2>
    <div class="sub">Pick one focused track to start.</div>
    <div id="skill-list" class="skills"></div>
  </div>
</section>

<section class="screen" id="screen-lobby">
  <div class="panel">
    <h2>Lobby</h2>
    <div class="sub">You are enrolled in: <b id="selected-skill" style="color:var(--gold)"></b></div>
    <div class="lobby-card">
      <div class="stat">Current day<br><b>Day 1 / 21</b></div>
      <div class="stat">Daily target<br><b>15 minutes</b></div>
    </div>
  </div>
</section>
</div>

<script>
const API="https://zubhai-zubhai-backened.hf.space";
let userId="demo-user"; let userProfile={field:"",selected_skill:""}; let history=[];
const SKILLS_BY_FIELD={marketing:["AI for Content Creation","AI for Social Media","AI for Email Marketing"],developer:["AI for Code Review","AI for Documentation","AI for Testing"],student:["AI for Study Planning","AI for Research","AI for Writing"],hr:["AI for Recruitment","AI for Performance Reviews","AI for Training"],default:["AI Basics","AI for Productivity","AI for Communication"]};
const showScreen=id=>{document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');};
const getFieldKey=(f='')=>{f=f.toLowerCase();if(f.includes('market'))return'marketing';if(f.includes('dev')||f.includes('software'))return'developer';if(f.includes('student'))return'student';if(f.includes('hr')||f.includes('recruit'))return'hr';return'default';};
function addMsg(text,who){const box=document.getElementById('chat-box');box.innerHTML+=`<div class="msg ${who}"><div class="bubble">${text}</div></div>`;box.scrollTop=box.scrollHeight;}
function startOnboarding(){showScreen('screen-onboard');addMsg("Hi! I'm Zubhai AI 🤖 What is your field? (marketing, developer, student, HR)",'ai');}
async function sendMessage(){const input=document.getElementById('chat-input');const msg=input.value.trim();if(!msg) return;input.value='';addMsg(msg,'user');if(!userProfile.field) userProfile.field=msg;let reply="Awesome. I’ve got your profile. Let’s pick your 21-day skill program.";try{const res=await fetch(`${API}/onboard`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg,history,user_id:userId})});const data=await res.json();reply=data.reply||reply;}catch(e){}addMsg(reply,'ai');history.push({role:'user',content:msg},{role:'assistant',content:reply});setTimeout(showSkillSelection,600);}
function showSkillSelection(){showScreen('screen-skill');const skills=SKILLS_BY_FIELD[getFieldKey(userProfile.field)]||SKILLS_BY_FIELD.default;const list=document.getElementById('skill-list');list.innerHTML='';skills.forEach(skill=>{const btn=document.createElement('button');btn.className='skill';btn.textContent=skill;btn.onclick=()=>selectSkill(skill);list.appendChild(btn);});}
async function selectSkill(skill){try{await fetch(`${API}/select-skill`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:userId,skill})});}catch(e){}userProfile.selected_skill=skill;document.getElementById('selected-skill').textContent=skill;showScreen('screen-lobby');}
(function init3D(){const canvas=document.getElementById('bg-canvas');const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));const scene=new THREE.Scene();const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.1,1000);camera.position.z=30;const N=120,pts=[],pos=new Float32Array(N*3);for(let i=0;i<N;i++){const p={x:(Math.random()-.5)*80,y:(Math.random()-.5)*55,z:(Math.random()-.5)*35,vx:(Math.random()-.5)*.02,vy:(Math.random()-.5)*.02,vz:(Math.random()-.5)*.01};pts.push(p);pos[i*3]=p.x;pos[i*3+1]=p.y;pos[i*3+2]=p.z;}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0xF4C542,size:.3,transparent:true,opacity:.9})));const lgeo=new THREE.BufferGeometry();const lines=new THREE.LineSegments(lgeo,new THREE.LineBasicMaterial({color:0x4BD9FF,transparent:true,opacity:.12}));scene.add(lines);let mx=0,my=0;addEventListener('mousemove',e=>{mx=(e.clientX/innerWidth-.5)*4;my=-(e.clientY/innerHeight-.5)*4;});addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();});(function animate(){requestAnimationFrame(animate);pts.forEach((p,i)=>{p.x+=p.vx;p.y+=p.vy;p.z+=p.vz;if(Math.abs(p.x)>40)p.vx*=-1;if(Math.abs(p.y)>28)p.vy*=-1;if(Math.abs(p.z)>18)p.vz*=-1;pos[i*3]=p.x;pos[i*3+1]=p.y;pos[i*3+2]=p.z;});g.attributes.position.needsUpdate=true;const la=[];for(let i=0;i<N;i++)for(let j=i+1;j<N;j++){const dx=pts[i].x-pts[j].x,dy=pts[i].y-pts[j].y,dz=pts[i].z-pts[j].z;if(dx*dx+dy*dy+dz*dz<180)la.push(pts[i].x,pts[i].y,pts[i].z,pts[j].x,pts[j].y,pts[j].z);}lgeo.setAttribute('position',new THREE.Float32BufferAttribute(la,3));camera.position.x+=(mx-camera.position.x)*.03;camera.position.y+=(my-camera.position.y)*.03;camera.lookAt(scene.position);renderer.render(scene,camera);})();})();
startOnboarding();
</script>
</body>
</html>
