<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zubhai</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{--bg:#0a0a0f;--bg2:#12121a;--bg3:#1a1a2e;--gold:#FFD700;--cyan:#00D4FF;--orange:#FF6B35;--green:#00FF88;--text:#E8E8E8;--muted:#666}
    body{background:var(--bg);color:var(--text);font-family:'Segoe UI',sans-serif;min-height:100vh;position:relative}
    #bg-canvas{position:fixed;inset:0;z-index:0;opacity:.35;pointer-events:none}
    nav,.screen{position:relative;z-index:2}
    nav{background:rgba(18,18,26,.9);padding:14px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222}
    nav h1{color:var(--gold)} .nav-right{display:flex;gap:12px}
    .pts-badge,.streak-badge{padding:6px 14px;border-radius:20px;font-weight:700;font-size:14px}
    .pts-badge{background:#1a1a00;border:1px solid var(--gold);color:var(--gold)} .streak-badge{background:#1a0a00;border:1px solid var(--orange);color:var(--orange)}
    .screen{display:none}.screen.active{display:block}
    .auth-box,.panel{background:var(--bg2);border:1px solid #222;border-radius:16px;padding:28px;max-width:540px;margin:24px auto}
    .auth-input,.chat-input,.select-input,.submit-input,.submit-textarea{width:100%;padding:12px;background:var(--bg3);border:1px solid #333;border-radius:10px;color:var(--text);margin-bottom:10px}
    .btn{padding:12px 16px;border:none;border-radius:10px;font-weight:700;cursor:pointer}
    .btn-gold{background:var(--gold);color:#000;width:100%}.btn-cyan{background:var(--cyan);color:#000}
    #chat-box{height:320px;overflow:auto;border:1px solid #222;background:var(--bg2);border-radius:12px;padding:14px;margin-bottom:12px}
    .msg{margin:10px 0}.msg.ai span{background:var(--bg3);color:var(--cyan)}.msg.user{text-align:right}.msg.user span{background:#1a1a00;color:var(--gold)}
    .msg span{display:inline-block;padding:10px 14px;border-radius:12px;max-width:85%}
    .skill-grid{display:grid;gap:10px}.skill-btn{background:var(--bg3);color:var(--text);border:1px solid #333;padding:14px;border-radius:10px;text-align:left;cursor:pointer}.skill-btn:hover{border-color:var(--gold)}
  </style>
</head>
<body>
<canvas id="bg-canvas"></canvas>
<nav><h1>⚡ ZUBHAI</h1><div class="nav-right"><div class="streak-badge">🔥 <span id="streak-count">0</span> day streak</div><div class="pts-badge">🏆 <span id="total-points">0</span> pts</div></div></nav>

<div class="screen active" id="screen-auth"><div class="auth-box"><h2>⚡ ZUBHAI</h2><p>Learn AI by doing.</p><input class="auth-input" id="auth-email" placeholder="Email"><input class="auth-input" id="auth-password" type="password" placeholder="Password"><button class="btn btn-gold" onclick="handleAuth()">Sign Up / Login</button><div id="auth-msg"></div></div></div>

<div class="screen" id="screen-onboard"><div class="panel"><h2>Build Your Profile</h2><div id="chat-box"></div><div style="display:flex;gap:8px"><input id="chat-input" class="chat-input" placeholder="Type..." onkeypress="if(event.key==='Enter') sendMessage()"><button class="btn btn-cyan" onclick="sendMessage()">Send</button></div></div></div>

<div class="screen" id="screen-skill"><div class="panel"><h2>Choose your 21-day skill program</h2><p style="color:var(--muted);margin:8px 0 16px">Select one track to continue.</p><div id="skill-list" class="skill-grid"></div></div></div>

<div class="screen" id="screen-lobby"><div class="panel"><h2>Lobby</h2><p>Your selected track: <span id="selected-skill" style="color:var(--gold)"></span></p></div></div>

<script>
const API="https://zubhai-zubhai-backened.hf.space";
const SUPABASE_URL="https://ceikerijcbyxtltpkqcu.supabase.co";
const SUPABASE_KEY="<SECRET>";
let userId=null,userProfile=null,history=[];

const SKILLS_BY_FIELD={marketing:["AI for Content Creation","AI for Social Media","AI for Email Marketing"],developer:["AI for Code Review","AI for Documentation","AI for Testing"],student:["AI for Study Planning","AI for Research","AI for Writing"],hr:["AI for Recruitment","AI for Performance Reviews","AI for Training"],default:["AI Basics","AI for Productivity","AI for Communication"]};

function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}
function getFieldKey(field=''){const f=field.toLowerCase();if(f.includes('market'))return'marketing';if(f.includes('dev')||f.includes('software'))return'developer';if(f.includes('student'))return'student';if(f.includes('hr')||f.includes('recruit'))return'hr';return'default';}
function addMsg(text,who){const box=document.getElementById('chat-box');box.innerHTML+=`<div class="msg ${who}"><span>${text}</span></div>`;box.scrollTop=box.scrollHeight;}

async function handleAuth(){const email=document.getElementById('auth-email').value.trim();const password=document.getElementById('auth-password').value.trim();if(!email||!password)return;const res=await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`,{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY},body:JSON.stringify({email,password})});const data=await res.json();if(data.access_token){userId=data.user.id;await loadUserProfile();}else{document.getElementById('auth-msg').innerText='Login failed';}}
async function loadUserProfile(){const res=await fetch(`${SUPABASE_URL}/rest/v1/users?id=eq.${userId}`,{headers:{'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`}});const data=await res.json();userProfile=data[0]||{};if(userProfile.field){if(userProfile.selected_skill){goToLobby();}else{showSkillSelection();}}else{startOnboarding();}}
function startOnboarding(){showScreen('screen-onboard');addMsg("Hi! I'm Zubhai AI 🤖 What is your job or field?",'ai');}
async function sendMessage(){const input=document.getElementById('chat-input');const msg=input.value.trim();if(!msg)return;input.value='';addMsg(msg,'user');const res=await fetch(`${API}/onboard`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg,history,user_id:userId})});const data=await res.json();addMsg(data.reply,'ai');history.push({role:'user',content:msg},{role:'assistant',content:data.reply});if(data.reply.toLowerCase().includes('level')){setTimeout(loadUserProfile,1000);}}
function showSkillSelection(){showScreen('screen-skill');const skills=SKILLS_BY_FIELD[getFieldKey(userProfile.field)]||SKILLS_BY_FIELD.default;const list=document.getElementById('skill-list');list.innerHTML='';skills.forEach(skill=>{const b=document.createElement('button');b.className='skill-btn';b.textContent=skill;b.onclick=()=>selectSkill(skill);list.appendChild(b);});}
async function selectSkill(skill){await fetch(`${API}/select-skill`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:userId,skill})});userProfile.selected_skill=skill;goToLobby();}
function goToLobby(){document.getElementById('selected-skill').innerText=userProfile.selected_skill||'';showScreen('screen-lobby');}

(function init3D(){const canvas=document.getElementById('bg-canvas');const r=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true});const s=new THREE.Scene();const c=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,1e3);c.position.z=32;r.setSize(innerWidth,innerHeight);const pts=[];const arr=new Float32Array(240);for(let i=0;i<80;i++){const p={x:(Math.random()-.5)*70,y:(Math.random()-.5)*45,z:(Math.random()-.5)*30,vx:(Math.random()-.5)*.02,vy:(Math.random()-.5)*.02,vz:(Math.random()-.5)*.01};pts.push(p);arr[i*3]=p.x;arr[i*3+1]=p.y;arr[i*3+2]=p.z;}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(arr,3));s.add(new THREE.Points(g,new THREE.PointsMaterial({color:0xFFD700,size:.28,transparent:true,opacity:.9})));addEventListener('resize',()=>{r.setSize(innerWidth,innerHeight);c.aspect=innerWidth/innerHeight;c.updateProjectionMatrix();});(function a(){requestAnimationFrame(a);pts.forEach((p,i)=>{p.x+=p.vx;p.y+=p.vy;p.z+=p.vz;if(Math.abs(p.x)>35)p.vx*=-1;if(Math.abs(p.y)>22)p.vy*=-1;if(Math.abs(p.z)>15)p.vz*=-1;arr[i*3]=p.x;arr[i*3+1]=p.y;arr[i*3+2]=p.z;});g.attributes.position.needsUpdate=true;r.render(s,c);})();})();
</script>
</body>
</html>
