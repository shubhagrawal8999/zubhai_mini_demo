<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Zubhai logo</title>
  <desc id="desc">A dark navy rounded-square app icon with an electric blue and cyan lightning Z mark.</desc>
  <defs>
    <linearGradient id="bg" x1="72" y1="52" x2="440" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#141e2e"/>
      <stop offset="0.48" stop-color="#0d1220"/>
      <stop offset="1" stop-color="#05080f"/>
    </linearGradient>
    <linearGradient id="bolt" x1="171" y1="92" x2="348" y2="418" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#93c5fd"/>
      <stop offset="0.42" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="rim" x1="78" y1="64" x2="432" y2="454" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#3b82f6" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0.75"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.231 0 0 0 0 0.510 0 0 0 0 0.965 0 0 0 0.85 0" result="blueGlow"/>
      <feMerge>
        <feMergeNode in="blueGlow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect x="23" y="23" width="466" height="466" rx="96" fill="none" stroke="url(#rim)" stroke-width="14"/>

  <g opacity="0.72" filter="url(#glow)">
    <path d="M114 269c54-79 132-122 236-128" fill="none" stroke="#3b82f6" stroke-width="8" stroke-linecap="round" stroke-dasharray="2 28"/>
    <path d="M143 356c79 45 168 42 248-9" fill="none" stroke="#06b6d4" stroke-width="7" stroke-linecap="round" stroke-dasharray="2 30"/>
  </g>

  <circle cx="392" cy="147" r="13" fill="#93c5fd" opacity="0.95"/>
  <circle cx="126" cy="283" r="10" fill="#06b6d4" opacity="0.85"/>
  <circle cx="372" cy="352" r="9" fill="#60a5fa" opacity="0.8"/>

  <g filter="url(#softShadow)">
    <path d="M301 70 126 288h115l-35 154 183-230H270l31-142Z" fill="url(#bolt)" filter="url(#glow)"/>
    <path d="M301 70 126 288h115l-35 154 183-230H270l31-142Z" fill="none" stroke="#f8fafc" stroke-opacity="0.26" stroke-width="8" stroke-linejoin="round"/>
    <path d="M256 111 181 246h107l-30 123 82-128H231l25-130Z" fill="#f8fafc" opacity="0.13"/>
  </g>
</svg>
